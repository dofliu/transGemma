name: Health Check

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  health-check:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run strict project health check
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/check_project_health.ps1 -FailOnMojibake

      - name: Run eval gate (dry mode)
        run: |
          python tools/eval_runner.py --mode dry --limit 32 --max-errors 0 --min-non-empty-rate 0.0

      - name: Upload eval artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-artifacts
          path: reports/eval/
          if-no-files-found: ignore
