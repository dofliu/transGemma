version: "3.8"

services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  transgemma:
    build: .
    ports:
      - "${GRADIO_SERVER_PORT:-7860}:7860"
      - "${TG_API_PORT:-8000}:8000"
    volumes:
      - ./temp:/app/temp
      - ./logs:/app/logs
      - ./history.db:/app/history.db
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - TG_LOG_LEVEL=${TG_LOG_LEVEL:-INFO}
      - TG_LOG_TO_FILE=true
    depends_on:
      - ollama
    restart: unless-stopped

  # API-only mode (optional)
  transgemma-api:
    build: .
    command: ["python", "-m", "uvicorn", "api:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8001:8000"
    volumes:
      - ./temp:/app/temp
      - ./logs:/app/logs
      - ./history.db:/app/history.db
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - TG_LOG_LEVEL=${TG_LOG_LEVEL:-INFO}
    depends_on:
      - ollama
    profiles:
      - api

volumes:
  ollama_data:
